name: Build and deploy

# Source lives on the `source` branch; the built site is published to `master`,
# which GitHub Pages serves. No Pages settings change / admin needed.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          # ponytail: built-in GITHUB_TOKEN works for same-repo push; swap for a
          # deploy key (deploy_key:) if the org restricts GITHUB_TOKEN to read-only.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: master
